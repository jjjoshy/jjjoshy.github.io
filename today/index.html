<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#21104b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Lumina — A little light every day</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;background:#21104b}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100svh;background:radial-gradient(ellipse at 15% 10%,#6e3c9b 0,transparent 45%),linear-gradient(145deg,#21104b,#542a8b 58%,#1b3c81);background-attachment:fixed}.app{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));position:relative}.close{position:absolute;right:calc(18px + env(safe-area-inset-right));top:calc(18px + env(safe-area-inset-top));width:46px;height:46px;border:1px solid #ffffff55;border-radius:50%;background:#ffffff16;color:white;font-size:25px;line-height:1;cursor:pointer}.close:hover{background:#ffffff35}.close:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid #ffd5b2;outline-offset:3px}.content{width:min(760px,100%);text-align:center}.brand{font-size:clamp(23px,5vw,32px);font-weight:800;letter-spacing:-1.5px}.brand span{color:#ffd0a9}.tagline{margin:5px 0 34px;color:#ffffffad;font-size:13px}.picker{width:min(280px,100%);margin:0 auto 22px;padding:12px 40px 12px 15px;border:1px solid #ffffff45;border-radius:14px;background:#ffffff16;color:white;font:inherit}.picker option{background:#542a8b}.card{padding:clamp(25px,7vw,58px) clamp(20px,7vw,65px);border:1px solid #ffffff38;border-radius:26px;background:#ffffff18;box-shadow:0 24px 80px #10062555;backdrop-filter:blur(16px)}.mark{font:76px/.65 Georgia,serif;color:#ffd5b2}.quote{margin:25px auto 0;font:500 clamp(28px,6vw,48px)/1.2 Georgia,"Times New Roman",serif;letter-spacing:-.04em}.author{margin-top:24px;color:#ffe1d1;font-size:15px}.controls{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:24px}.controls button{min-width:50px;height:50px;padding:0 16px;border:1px solid #ffffff55;border-radius:28px;background:#ffffff16;color:white;font:inherit;font-size:18px;cursor:pointer}.controls button:hover{background:#ffffff38}.controls .primary{min-width:118px;font-size:14px}.message{min-height:24px;margin-top:18px;color:#ffffffbb;font-size:13px}.hint{margin-top:18px;color:#ffffff88;font-size:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:480px){.app{justify-content:flex-start;padding-top:calc(76px + env(safe-area-inset-top))}.tagline{margin-bottom:28px}.card{border-radius:22px}.controls{gap:8px}.controls button{min-width:46px;height:46px;padding:0 13px}.controls .primary{min-width:100px}}@media(prefers-reduced-motion:no-preference){.card{animation:appear .45s ease-out}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}}
</style>
</head>
<body>
<main class="app">
<button class="close" id="close" type="button" aria-label="Close app" title="Close">×</button>
<div class="content">
<div class="brand">lumina<span>.</span></div><div class="tagline">A little light every day</div>
<label class="sr-only" for="topic">Choose an inspiration topic</label>
<select class="picker" id="topic"><option>All topics</option><option>Success</option><option>Focus</option><option>Confidence</option><option>Wisdom</option><option>Courage</option><option>Happiness</option><option>Growth</option><option>Discipline</option></select>
<section class="card" aria-live="polite"><div class="mark" aria-hidden="true">“</div><div class="quote" id="quote"></div><div class="author" id="author"></div></section>
<div class="controls"><button id="prev" type="button" aria-label="Previous quote">←</button><button class="primary" id="random" type="button">Another thought</button><button id="copy" type="button" aria-label="Copy quote">▢</button><button id="share" type="button" aria-label="Share quote">↗</button></div>
<div class="message" id="message" role="status" aria-live="polite"></div>
<div class="hint">A new thought. A new perspective. A new beginning.</div>
</div>
</main>
<script>
const quotes=[
['Success','The secret of getting ahead is getting started.','Mark Twain'],['Success','Great things are done by a series of small things brought together.','Vincent van Gogh'],['Success','Success is not final, failure is not fatal: it is the courage to continue that counts.','Winston Churchill'],['Success','It always seems impossible until it’s done.','Nelson Mandela'],
['Focus','Concentrate all your thoughts upon the work in hand.','Alexander Graham Bell'],['Focus','Where focus goes, energy flows.','Tony Robbins'],['Focus','The ability to simplify means to eliminate the unnecessary.','Hans Hofmann'],
['Confidence','Believe you can and you’re halfway there.','Theodore Roosevelt'],['Confidence','Trust yourself. You know more than you think you do.','Benjamin Spock'],['Confidence','You are enough just as you are.','Meghan Markle'],
['Wisdom','Knowing yourself is the beginning of all wisdom.','Aristotle'],['Wisdom','The only true wisdom is in knowing you know nothing.','Socrates'],['Wisdom','Turn your wounds into wisdom.','Oprah Winfrey'],
['Courage','Courage is grace under pressure.','Ernest Hemingway'],['Courage','Fortune favors the bold.','Virgil'],['Courage','You must do the things you think you cannot do.','Eleanor Roosevelt'],
['Happiness','Happiness depends upon ourselves.','Aristotle'],['Happiness','Happiness is not something ready made. It comes from your own actions.','Dalai Lama'],
['Growth','What we think, we become.','Buddha'],['Growth','Live as if you were to die tomorrow. Learn as if you were to live forever.','Mahatma Gandhi'],
['Discipline','Discipline is the bridge between goals and accomplishment.','Jim Rohn'],['Discipline','Your future is created by what you do today, not tomorrow.','Robert Kiyosaki']
];
let shown=[],position=-1,topic='All topics';const $=id=>document.getElementById(id);
function pool(){return topic==='All topics'?quotes:quotes.filter(q=>q[0]===topic)}
function show(q){$('quote').textContent='';requestAnimationFrame(()=>{$('quote').textContent=q[1]});$('author').textContent='— '+q[2];$('message').textContent='';}
function next(){const choices=pool();if(!choices.length)return;let q=choices[Math.floor(Math.random()*choices.length)];if(choices.length>1&&shown[position]?.[1]===q[1])q=choices[(choices.indexOf(q)+1)%choices.length];shown=shown.slice(0,position+1);shown.push(q);position++;show(q)}
$('topic').addEventListener('change',e=>{topic=e.target.value;shown=[];position=-1;next()});$('random').addEventListener('click',next);$('prev').addEventListener('click',()=>{if(position>0){position--;show(shown[position])}});
$('copy').addEventListener('click',async()=>{const text='“'+shown[position][1]+'” — '+shown[position][2];try{await navigator.clipboard.writeText(text);$('message').textContent='Quote copied.'}catch{$('message').textContent='Copy isn’t available in this browser.'}});
$('share').addEventListener('click',async()=>{const q=shown[position],text='“'+q[1]+'” — '+q[2];try{if(navigator.share)await navigator.share({title:'Lumina inspiration',text});else{await navigator.clipboard.writeText(text);$('message').textContent='Quote copied to share.'}}catch{}});
$('close').addEventListener('click',()=>{window.close();setTimeout(()=>{if(!window.closed)$('message').textContent='Your browser won’t let a webpage close itself. Close this tab, or swipe the app away from your recent apps.';},300);});
if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
next();
</script>
</body>
</html>
