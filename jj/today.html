<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; padding: 20px; }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      z-index: 9999;
      overflow-y: auto;
      background: #fff;
    }
    .overlay.active { display: block; }

    .overlay iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .close-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10000;
      padding: 8px 14px;
      background: rgba(0,0,0,.7);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <a href="#" onclick="openPage('https://jjjoshy.github.io/today/index.html'); return false;">Today</a>

  <div id="overlay" class="overlay">
    <button class="close-btn" onclick="closePage()">✕</button>
    <iframe id="frame"></iframe>
  </div>

  <script>
    function openPage(url) {
      document.getElementById('frame').src = url;
      document.getElementById('overlay').classList.add('active');
      document.body.style.overflow = 'hidden'; // prevent background scroll
      // Optional: try Fullscreen API (works on Android)
      document.getElementById('overlay').requestFullscreen?.({ navigationUI: 'hide' });
    }

    function closePage() {
      document.getElementById('overlay').classList.remove('active');
      document.getElementById('frame').src = '';
      document.body.style.overflow = '';
      if (document.fullscreenElement) document.exitFullscreen();
    }
  </script>

</body>
</html>
